[package]
name = "ucom"
version = "0.1.0"
edition = "2024"
readme = "README.md"

[profile.release]
lto = "thin"
strip = true

[lints.clippy]
trivially_copy_pass_by_ref = "warn"
mod_module_files = "warn"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
ctrlc = "3.5"
dirs = "7.0.0"
itertools = "0.15"
path-absolutize = "4.0"
quick-xml = { version = "0.42.0", default-features = false, features = ["serialize"] }
regex = { version = "1.13" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
strum = { version = "0.28", features = ["derive"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
ureq = { version = "3.4", default-features = false, features = ["json", "rustls", "gzip"] }
uuid = { version = "1.29", features = ["v4", "serde"] }
walkdir = "2.5"
yansi = { version = "1.0", features = ["hyperlink"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

# End-to-end tests against a fake Unity. The test program is also the fake, so it has its own
# `main` instead of the standard test harness.
[[test]]
name = "fake_unity"
harness = false
